spring:
  application:
    name: memory-design
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://127.0.0.1:13306/memory?connectionTimeZone=UTC}
    username: ${DATABASE_USER:memory}
    password: ${DATABASE_PASSWORD:memory-local}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      connect-timeout: 1s
      timeout: 1s

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
